
name: Crowd AI - Publish Docker Images

on:
  push:
    branches:
      - main
      - ci-cd-pipeline
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Build and Publish Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Build backend image
        run: |
          docker build \
            --tag crowd-ai-backend:latest \
            ./backend

      - name: Build frontend image
        run: |
          docker build \
            --tag crowd-ai-frontend:latest \
            ./frontend

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and push backend image
        run: |
          docker tag crowd-ai-backend:latest poovidha/crowd-ai-backend:latest
          docker tag crowd-ai-backend:latest poovidha/crowd-ai-backend:${{ github.sha }}

          docker push poovidha/crowd-ai-backend:latest
          docker push poovidha/crowd-ai-backend:${{ github.sha }}

      - name: Tag and push frontend image
        run: |
          docker tag crowd-ai-frontend:latest poovidha/crowd-ai-frontend:latest
          docker tag crowd-ai-frontend:latest poovidha/crowd-ai-frontend:${{ github.sha }}

          docker push poovidha/crowd-ai-frontend:latest
          docker push poovidha/crowd-ai-frontend:${{ github.sha }}


name: Crowd AI - Publish Docker Images

on:
  push:
    branches:
      - main
      - ci-cd-pipeline
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker images
        run: docker compose build

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and push backend
        run: |
          docker tag crowd-ai-main-backend:latest poovidha/crowd-ai-backend:latest
          docker tag crowd-ai-main-backend:latest poovidha/crowd-ai-backend:${{ github.sha }}
          docker push poovidha/crowd-ai-backend:latest
          docker push poovidha/crowd-ai-backend:${{ github.sha }}

      - name: Tag and push frontend
        run: |
          docker tag crowd-ai-main-frontend:latest poovidha/crowd-ai-frontend:latest
          docker tag crowd-ai-main-frontend:latest poovidha/crowd-ai-frontend:${{ github.sha }}
          docker push poovidha/crowd-ai-frontend:latest
          docker push poovidha/crowd-ai-frontend:${{ github.sha }}

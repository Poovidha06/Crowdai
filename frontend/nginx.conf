# ==============================================================================
# CrowdVision AI - Frontend Nginx Configuration
# High-performance SPA server + Reverse Proxy for REST & WebSocket APIs
# ==============================================================================

server {
    listen 80;
    server_name localhost;

    # Gzip Compression for fast delivery
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    # Allow uploading CCTV video files (up to 200MB) to the backend
    client_max_body_size 200M;

    # 1. Reverse Proxy for WebSocket Analytics Stream
    location /api/ws/ {
        proxy_pass http://backend:8000/api/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep alive streaming WebSockets without premature timeouts
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 2. Reverse Proxy for Backend REST API
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # 3. Static Asset Caching
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 4. React SPA Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 5. Health Check Endpoint
    location = /healthz {
        access_log off;
        return 200 "healthy\n";
    }
}
